# ===============================
# =       SERVER CONFIG        =
# ===============================
server:
  port: 8081
  servlet:
    context-path: /
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: always

# ===============================
# =       SPRING CONFIG        =
# ===============================
spring:
  application:
    name: my-spring-boot-app
  profiles:
    active: dev
  main:
    banner-mode: "console"
    allow-bean-definition-overriding: true

  security:
    user:
      name: anil
      password: mysecret123
      roles: ADMIN

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from:
      name: ${MAIL_FROM_NAME}
      email: ${MAIL_FROM_EMAIL}

# ===============================
# =       ACTUATOR CONFIG      =
# ===============================
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: "always"
  server:
    port: 8081

# ===============================
# =       INFO CONFIG          =
# ===============================
info:
  app:
    name: My Spring Boot App
    version: 1.0.0
    maintainer: Anil Kumar

# ===============================
# =       LOGGING CONFIG       =
# ===============================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.example: DEBUG

    # Add these for mail debugging
    org.springframework.mail: DEBUG
    org.springframework.boot.autoconfigure.mail: DEBUG
    org.apache.commons.net.smtp: DEBUG
    javax.mail: DEBUG
    
  file:
    name: logs/app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ===============================
# =       SWAGGER CONFIG       =
# ===============================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ===============================
# =       CUSTOM PROPERTIES    =
# ===============================
custom:
  app:
    version: 1.0.0
    maintainer: Anil Kumar Shrivastava
